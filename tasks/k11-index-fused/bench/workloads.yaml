# K11 workload：spec chunk 索引串画像（K9 档：16k 输入 2 chunk×4 req；decode 主形状）
workloads:
  - id: w01   # decode：64 token、spec k=3×16req≈48 / ns 16
    axes: {tokens: 64, dim: 4096, k: 48, m: 16}
    dtype: bf16
    repr: true
    inputs:
      - {name: x,        source: main, shape_axes: [tokens, dim]}
      - {name: idx_spec, source: arange, shape: [k]}
      - {name: idx_ns,   source: arange, shape: [m]}
  - id: w02   # prefill 4k chunk
    axes: {tokens: 4096, dim: 4096, k: 3072, m: 1024}
    dtype: bf16
    inputs:
      - {name: x,        source: main, shape_axes: [tokens, dim]}
      - {name: idx_spec, source: arange, shape: [k]}
      - {name: idx_ns,   source: arange, shape: [m]}
  - id: w03   # 长 prefill 16k chunk
    axes: {tokens: 16384, dim: 4096, k: 12288, m: 4096}
    dtype: bf16
    inputs:
      - {name: x,        source: main, shape_axes: [tokens, dim]}
      - {name: idx_spec, source: arange, shape: [k]}
      - {name: idx_ns,   source: arange, shape: [m]}
