    chain:
      - {entry: triton-ascend-api-rules,        layer: L0}
      - {entry: triton-ascend-hw-constraints,   layer: L0}
      - {entry: triton-ascend-design-cases,     layer: L1, why: "matmul-swizzle2d 案例"}
      # TODO(Phase 3): akg guides/triton-ascend-matmul + ascendc-performance-best-practices matmul 族编目
    fallback_on_miss: [blindspot-declaration 条款]

  matmul-3510-blaze:
    arch: [dav_3510]
    dsl: [ascendc]
    chain:
      # TODO(Phase 3): ascendc-blaze-best-practice 四步流程编目（已 vendored 在 knowledge/skills/ascendc/）
    fallback_on_miss: [blindspot-declaration 条款]

  precision-triage:                            # 症状驱动的诊断路由（Phase 2 诊断闭环用）
