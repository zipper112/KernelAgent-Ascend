# deps/skills.yaml —— vendored skill 资产索引（v2，自包含）
# v2 变更：资产实体已 vendor 进 knowledge/skills/<group>/<name>/（迁移安全）；
#          本文件只保留"分组-用途-路由引用"映射；完整清单与 hash 见 deps/vendor-manifest.yaml。
# 增删改流程（maintenance.md §3）：改本文件 + vendor-manifest + 路由验证，commit 前缀 deps:。

version: 2
updated: 2026-09-25

groups:
  core:          "跨路线诊断/验证/调优件（13 个，全部已路由或备用）"
  triton-ascend: "Triton 主路线（6 个）"
  ascendc:       "AscendC 深度路线（24 个，Phase 4 启用）"
  pypto:         "PyPTO 路线（17 个，Phase 4 启用）"
  tilelang:      "TileLang 路线（6 个，Phase 4 启用）"
  akg:           "akg 内置 skill 整树（89 个 SKILL.md，钉版 5aa15f3；triton-ascend 子树 43 个为主力）"

routed:   # 被 knowledge/router/index.yaml 引用的资产（增删必须同步路由验证）
  - {asset: core/ops-profiling,                       entries: [msprof-collect-7groups, bound-quickref]}
  - {asset: core/ops-precision-standard,              entries: [precision-standard]}
  - {asset: core/npu-arch,                            entries: [npu-arch-table]}
  - {asset: core/torch-ops-profiler,                  entries: [torch-ops-profiling]}
  - {asset: core/asys-toolkit,                        entries: [fault-collect-asys]}
  - {asset: core/ascendc-perf-optimize,               entries: [perf-optimize-flow]}
  - {asset: core/ascendc-performance-best-practices,  entries: [norm-family-opt]}
  - {asset: core/ascendc-crash-debug,                 entries: [crash-quickref]}
  - {asset: core/ascendc-precision-debug,             entries: [precision-quickref]}
  - {asset: core/ascendc-runtime-debug,               entries: [runtime-errcodes]}
  - {asset: triton-ascend/triton-op-coding,           entries: [triton-ascend-coding-standards]}
  - {asset: triton-ascend/triton-op-designer,         entries: [triton-ascend-design-cases]}
  - {asset: triton-ascend/triton-precision-debug,     entries: [triton-ascend-precision-debug]}
  - {asset: triton-ascend/triton-latency-optimizer,   entries: [triton-ascend-latency-opt]}
  - {asset: triton-ascend/triton-simulator-optimizer, entries: [triton-simulator-opt]}
  - {asset: triton-ascend/triton-op-verifier,         entries: [triton-op-verify-standard]}
  - {asset: akg/triton-ascend,                        entries: [norm 族全部 akg 条目见 index.yaml]}

unrouted:  # 已 vendor、暂无路由条目（启用时补 index 条目）
  core:    [msaicerr-toolkit, msnpureport-toolkit, ascendc-env-check]
  triton-ascend: []
  ascendc: ["整组（Phase 4：tiling/st/whitebox/ut/code-review/sync-audit/docs/四模板/regbase/blaze/mc2/api-bp/catlass 三件/extension/cann-env）"]
  pypto:   ["整组（Phase 4）"]
  tilelang: ["整组（Phase 4）"]
  akg:     ["triton-ascend 子树外的 10 个族（cuda-c/cpp/swft 等，Phase 4 按需）"]

verification:
  - "tools/check_env.py：vendor-manifest 每条 path 存在 + index.yaml 每条 ref 仓内可解析"
  - "tests/test_assets.py：上述断言的 CI 版（防断链复发）"
